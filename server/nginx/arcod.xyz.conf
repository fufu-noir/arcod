server {
    listen 80;
    server_name arcod.xyz www.arcod.xyz;
    return 301 https://arcod.xyz$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name www.arcod.xyz;

    ssl_certificate /etc/letsencrypt/live/arcod.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/arcod.xyz/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://arcod.xyz$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name arcod.xyz;

    ssl_certificate /etc/letsencrypt/live/arcod.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/arcod.xyz/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Next.js static assets (long cache)
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3002;
        proxy_cache_valid 200 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
